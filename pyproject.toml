[project]
name = "soundstages"
author = "ebro"
description = "Audio feature evaluation across the popularity distribution via regression."
license = "MIT"
version = "0.1.0"
dependencies = [
    "pandas >= 2.2",
    "numpy >= 1.26",
    "pyarrow >= 15.0",
    "matplotlib >= 3.8",
    "seaborn >= 0.13",
    "statsmodels >= 0.14",
    "scikit-learn >= 1.4",
    "xgboost >= 2.0",
    "lightgbm >= 4.3",
    "shap >= 0.45",
]
requires-python = ">= 3.11"

[project.optional-dependencies]
collection = [
    "requests >= 2.31",
    "beautifulsoup4 >= 4.12",
    "lxml >= 5.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]

[tool.ruff.format]
quote-style = "single"